<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alwatr Synapse Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      padding: 2rem;
      background-color: #f4f4f9;
      color: #333;
    }
    h1 {
      color: #00796b;
    }
    .clickable {
      padding: 1rem;
      margin: 0.5rem 0;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }
    .clickable:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    #main-title {
      padding: 0.5rem;
      border-radius: 8px;
    }
    #add-content-btn {
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 1rem;
    }
    #add-content-btn:hover {
      background-color: #004d40;
    }
    #dynamic-container {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px dashed #ccc;
      border-radius: 8px;
      min-height: 50px;
      background-color: #fafafa;
    }
  </style>
</head>
<body>

  <h1 id="main-title">🚀 Alwatr Synapse Demo</h1>

  <h2>Static Content</h2>
  <div class="clickable">Click me! (1)</div>
  <div class="clickable">Click me! (2)</div>

  <hr>

  <h2>Dynamic Content</h2>
  <button id="add-content-btn">Add Dynamic Clickable Box</button>
  <div id="dynamic-container">
    <!-- New content will be added here -->
  </div>

  <!-- Load the compiled demo script -->
  <script type="module" src="./main.mjs"></script>

</body>
</html>
