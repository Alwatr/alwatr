<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>File Index</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=2, user-scalable=yes, viewport-fit=cover"
    />
    <style>
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --border: #252a34;
        --text: #e6e6e6;
        --muted: #9aa0aa;
        --accent: #4da3ff;
        --folder: #ffd166;
        --hover: #1f2430;
      }

      * {
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }

      .container {
        width: 100%;
        max-width: 800px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 20px;
        font-weight: 600;
      }

      .section-title {
        font-size: 14px;
        color: var(--muted);
        margin: 18px 0 8px;
      }

      .list {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }

      .item {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        text-decoration: none;
        color: inherit;
        transition: background 0.2s;
      }

      .item:last-child {
        border-bottom: none;
      }

      .item:hover {
        background: var(--hover);
      }

      .name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-grow: 1;
      }

      .icon {
        width: 20px;
        text-align: center;
        font-size: 16px;
        flex-shrink: 0;
      }

      .folder .icon {
        color: var(--folder);
      }

      .file .icon {
        color: var(--accent);
      }

      .size {
        font-size: 13px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .mtime {
        direction: rtl;
        font-size: 12px;
        color: var(--muted);
        flex-shrink: 0;
      }

      footer {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }

      /* Upload form — full row */
      .upload {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
      }

      .upload .file-input input[type='file'] {
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        flex-grow: 1;
      }

      .submit {
        background: linear-gradient(180deg, rgba(77, 163, 255, 0.12), rgba(77, 163, 255, 0.05));
        border: 1px solid rgba(77, 163, 255, 0.25);
        color: var(--accent);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        display: inline-block;
      }

      details.share-panel {
        margin-top: 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        overflow: hidden;
      }

      details.share-panel summary {
        list-style: none;
        cursor: pointer;
        padding: 12px 14px;
        color: var(--muted);
        font-size: 14px;
      }

      details.share-panel summary::-webkit-details-marker {
        display: none;
      }

      details.share-panel[open] summary {
        color: var(--text);
      }

      .share-area {
        padding: 12px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-end;
      }

      .share-area textarea {
        width: 100%;
        min-height: 180px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>
        Index of
        <span pathname>...</span>
      </h1>

      <div class="list">
        <a
          class="item folder back"
          href="../"
        >
          <div class="name">
            <span class="icon">↩</span>
            ..
          </div>
          <div class="size">Parent Directory</div>
        </a>
        {{LIST}}
      </div>

      <!-- Upload -->
      <form
        class="upload"
        action="?upload"
        method="post"
        enctype="multipart/form-data"
      >
        <label class="file-input">
          <input
            type="file"
            name="file"
          />
        </label>
        <input
          class="submit"
          type="submit"
          value="Upload"
        />
      </form>

      <!-- Share / Clipboard -->
      <details class="share-panel">
        <summary>
          <div class="name">
            <span class="icon">🔗</span>
            Share / Clipboard
          </div>
        </summary>

        <form
          class="share-area"
          action="?clipboard"
          method="post"
        >
          <textarea
            name="text"
            placeholder="Paste or write text here..."
          >
{{CLIPBOARD}}</textarea
          >
          <input
            class="submit"
            type="submit"
            value="Save"
          />
        </form>
      </details>

      <footer>Alwatr Fast File Server v2.0</footer>
    </div>

    <script>
      document.querySelector('[pathname]').innerHTML = location.pathname;

      if (location.pathname === '/') {
        document.querySelector('.back').remove();
      }
    </script>
  </body>
</html>
